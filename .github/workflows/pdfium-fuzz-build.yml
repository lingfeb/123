name: pdfium-fuzzer
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH="$(pwd)/depot_tools:$PATH"
          echo "$(pwd)/depot_tools" >> $GITHUB_PATH
          gclient --version || true
      - name: Fetch PDFium
        run: |
          fetch --no-history pdfium
          gclient sync --no-history
      - name: Build
        run: |
          cd pdfium
          gn gen out/fuzz --args='is_asan=true is_debug=false pdf_is_standalone=true pdf_enable_v8=false pdf_use_skia=false use_libfuzzer=true'
          echo "== all fuzzer targets =="
          gn ls out/fuzz | grep -E "fuzzer" | head -40 || echo "gn ls empty"
          FUZZERS=$(gn ls out/fuzz | sed 's|.*/:||' | grep -E '^pdf[a-z_]*_fuzzer$' | head -10 | tr '\n' ' ')
          echo "building: $FUZZERS"
          ninja -C out/fuzz -j4 $FUZZERS
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-fuzzer
          path: pdfium/out/fuzz/pdf*
          retention-days: 30
