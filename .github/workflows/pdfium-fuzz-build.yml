name: pdfium-fuzzer
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH="$(pwd)/depot_tools:$PATH"
          echo "$(pwd)/depot_tools" >> $GITHUB_PATH
          gclient --version || true
      - name: Fetch PDFium
        run: |
          fetch --no-history pdfium
          gclient sync --no-history
      - name: Build
        run: |
          cd pdfium
          gn gen out/fuzz --args='is_asan=true is_debug=false pdf_is_standalone=true pdf_enable_v8=false pdf_use_skia=false use_libfuzzer=true'
          ninja -C out/fuzz -j4 pdfium_fuzzer pdf_codec_jpeg_fuzzer pdf_codec_png_fuzzer pdf_codec_bmp_fuzzer pdf_codec_gif_fuzzer pdf_css_fuzzer pdf_lzw_fuzzer pdf_cfx_barcode_fuzzer pdf_bidi_fuzzer
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-fuzzer
          path: pdfium/out/fuzz/pdf*_*fuzzer
          retention-days: 30
