name: dawn-fuzzers
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-18 ninja-build libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Clone Dawn
        run: git clone --depth 1 https://dawn.googlesource.com/dawn dawn-src
      - name: Configure
        run: |
          cmake -S dawn-src -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=/usr/lib/llvm-18/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/lib/llvm-18/bin/clang++ \
            -DCMAKE_CXX_STANDARD=20 \
            -DDAWN_FETCH_DEPENDENCIES=ON \
            -DDAWN_ENABLE_ASAN=ON -DDAWN_BUILD_SAMPLES=OFF -DDAWN_ENABLE_WAYLAND=OFF -DDAWN_ENABLE_X11=OFF -DTINT_BUILD_SAMPLES=OFF -DDAWN_ENABLE_GLFW=OFF \
            -DDAWN_BUILD_FUZZERS=ON \
            -DTINT_BUILD_FUZZERS=ON \
            -DCMAKE_C_FLAGS="-O1 -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-O1 -fno-omit-frame-pointer"
      - name: Build
        run: ninja -C build -j4 dawn_wire_server_and_frontend_fuzzer tint_wgsl_fuzzer
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dawn-fuzzers
          path: |
            build/dawn_wire_server_and_frontend_fuzzer
            build/tint_wgsl_fuzzer
          retention-days: 30
